name: IndexNow

# main'e her push sonrası, Vercel deploy'unun bitmesini bekleyip
# tüm sitemap URL'lerini Bing/Yandex'e IndexNow ile bildirir.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vercel deploy için bekle
        run: sleep 120
      - name: IndexNow bildirimi
        run: node scripts/indexnow.mjs
